name: Live Dant3 MCP smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/live-mcp-smoke.mjs'
      - '.github/workflows/live-mcp-smoke.yml'
      - 'server.json'
  push:
    branches: [main]
    paths:
      - 'scripts/live-mcp-smoke.mjs'
      - '.github/workflows/live-mcp-smoke.yml'
      - 'server.json'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify Registry-declared MCP runtime from an external runner
        run: node scripts/live-mcp-smoke.mjs
