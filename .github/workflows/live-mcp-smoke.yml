name: Live Dant3 MCP smoke

# Cost guard: GitHub is a public discovery/evidence mirror, not production CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify Registry-declared MCP runtime from an external runner
        run: node scripts/live-mcp-smoke.mjs
