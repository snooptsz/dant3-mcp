name: Live Dant3 MCP smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/live-mcp-smoke.mjs'
      - '.github/workflows/live-mcp-smoke.yml'
      - 'server.json'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify live Dant3 discovery and MCP handshake
        run: node scripts/live-mcp-smoke.mjs
