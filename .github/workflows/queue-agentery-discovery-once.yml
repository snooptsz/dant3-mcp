name: Queue Dant3 in Agentery discovery once

# Cost guard: this is a one-shot discovery helper and must never run automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Agentery search tool and search Dant3
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://agentery.com/api/mcp'

          tools="$(curl --fail-with-body --silent --show-error \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            "$endpoint")"

          jq -e '.result.tools[]? | select(.name == "search_providers")' <<<"$tools" >/dev/null

          schema="$(jq -c '.result.tools[] | select(.name == "search_providers") | .inputSchema' <<<"$tools")"
          echo "Agentery search_providers schema: $schema"

          response="$(curl --fail-with-body --silent --show-error \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search_providers","arguments":{"query":"Dant3","provider_type":"mcp","response_mode":"summary"}}}' \
            "$endpoint")"

          jq -e '.error == null' <<<"$response" >/dev/null
          echo "$response" | jq .
