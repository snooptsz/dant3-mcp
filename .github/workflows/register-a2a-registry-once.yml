name: Register Dant3 in public A2A registry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-a2a-registry-once.yml'

permissions:
  contents: write

concurrency:
  group: register-dant3-a2a-once
  cancel-in-progress: true

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5

      - name: Register Dant3 Discovery Agent and verify listing
        shell: bash
        run: |
          set -euo pipefail

          card='https://dant3.net/.well-known/agent-card.json'
          api='https://a2aregistry.org/api'

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            "$card" | jq -e '.name == "Dant3 Discovery Agent"' >/dev/null

          status="$({ curl --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            --output /tmp/register.json \
            --write-out '%{http_code}' \
            -X POST "$api/agents/register" \
            -H 'Content-Type: application/json' \
            --data "{\"wellKnownURI\":\"$card\"}"; } || true)"

          echo "Registration HTTP status: $status"
          cat /tmp/register.json || true
          echo

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            "$api/agents?search=Dant3&limit=100" > /tmp/search.json

          jq --arg card "$card" '
            (if type == "array" then .
             elif (.agents? | type) == "array" then .agents
             elif (.results? | type) == "array" then .results
             elif (.items? | type) == "array" then .items
             else [] end)
            | map(select(
                ((.wellKnownURI? // .well_known_uri? // .well_known_url? // .agent_card_uri? // "") == $card)
                or ((.name? // "") | ascii_downcase | contains("dant3"))
              ))
            | first
          ' /tmp/search.json > /tmp/dant3-agent.json

          jq -e 'type == "object" and (.name? // "" | ascii_downcase | contains("dant3"))' \
            /tmp/dant3-agent.json >/dev/null

          {
            echo '# Dant3 A2A registry status'
            echo
            echo "- Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Agent card: $card"
            echo "- Registration HTTP status: $status"
            echo '- Registry search: Dant3 match confirmed'
            echo
            echo '```json'
            jq '{id, name, description, version, wellKnownURI, well_known_uri, agent_card_uri, is_healthy, conformance, task_conformance}' \
              /tmp/dant3-agent.json
            echo '```'
          } > A2A_REGISTRY_STATUS.md

          echo 'Dant3 is present in the public A2A registry.'

      - name: Persist verification and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/register-a2a-registry-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add A2A_REGISTRY_STATUS.md .github/workflows/register-a2a-registry-once.yml
          git diff --cached --quiet || git commit -m 'Record verified Dant3 A2A registry listing'
          git push
