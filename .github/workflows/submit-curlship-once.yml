name: Submit Dant3 to CurlShip once

# One-shot discovery helper. Manual-only to prevent recurring GitHub Actions spend.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Submit public Dant3 URL to bot-friendly directory API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST 'https://curlship.com/api/submit' \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: Dant3-directory-submitter/1.1' \
            --data '{"url":"https://dant3.net","email":"info@dant3.net"}'
