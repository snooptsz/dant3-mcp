name: Submit Dant3 to CurlShip once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/submit-curlship-once.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Submit public Dant3 URL to bot-friendly directory API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST 'https://curlship.com/api/submit' \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: Dant3-directory-submitter/1.0' \
            --data '{"url":"https://dant3.net","email":"info@dant3.net"}'
