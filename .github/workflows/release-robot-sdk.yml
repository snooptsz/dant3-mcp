name: Release Robot Python SDK

# Public package publication only. GitLab remains canonical source/review/release authority.
# Manual-only and guarded by an explicit confirmation phrase.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH_DANT3_ROBOT to publish the current sdk/python version to PyPI'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and test dant3-robot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build tooling and SDK
        run: |
          python -m pip install --upgrade pip build
          python -m pip install ./sdk/python
      - name: Run SDK tests
        run: python -m unittest discover -s sdk/python/tests -v
      - name: Verify zero-write doctor CLI is installed
        run: dant3-robot doctor --help
      - name: Build wheel and source distribution
        run: python -m build ./sdk/python --outdir "$GITHUB_WORKSPACE/dist"
      - name: Upload distributions for isolated publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish dant3-robot to PyPI
    if: ${{ inputs.confirm == 'PUBLISH_DANT3_ROBOT' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
