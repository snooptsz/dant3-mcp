name: Publish Dant3 MCP Registry

# Public-discovery publisher only. GitLab remains canonical source/review/release authority.
# Manual-only to prevent recurring GitHub Actions usage.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-dant3-mcp-registry
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact server metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/server.json" \
            -o server.json
          jq -e '.name == "io.github.snooptsz/dant3"' server.json >/dev/null
          jq -e '.version == "1.2.0"' server.json >/dev/null
          jq -e '.repository.source == "github" and .repository.id == "1319457914"' server.json >/dev/null
          jq -e '.remotes | any(.type == "streamable-http" and .url == "https://dant3.net/mcp")' server.json >/dev/null

      - name: Check whether publication is needed
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          payload="$(curl --fail --silent --show-error --get \
            --data-urlencode 'search=io.github.snooptsz/dant3' \
            --data-urlencode 'limit=20' \
            https://registry.modelcontextprotocol.io/v0.1/servers)"
          if jq -e '.servers[]? | select(.server.name == "io.github.snooptsz/dant3" and .server.version == "1.2.0")' <<<"${payload}" >/dev/null; then
            echo 'needs_publish=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'needs_publish=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Install pinned official MCP publisher
        if: steps.registry.outputs.needs_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          file='mcp-publisher_linux_amd64.tar.gz'
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --silent --show-error --location "${base}/${file}" -o "${file}"
          printf '%s  %s\n' "${MCP_PUBLISHER_LINUX_AMD64_SHA256}" "${file}" | sha256sum -c -
          tar xzf "${file}" mcp-publisher
          chmod +x mcp-publisher
          test "$(./mcp-publisher --version | tr -d '\r')" != ""

      - name: Authenticate with GitHub OIDC
        if: steps.registry.outputs.needs_publish == 'true'
        shell: bash
        run: ./mcp-publisher login github-oidc --registry https://registry.modelcontextprotocol.io

      - name: Publish Dant3 remote MCP server
        if: steps.registry.outputs.needs_publish == 'true'
        shell: bash
        run: ./mcp-publisher publish ./server.json

      - name: Verify Official MCP Registry visibility
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in 1 2 3 4 5 6; do
            payload="$(curl --fail --silent --show-error --get \
              --data-urlencode 'search=io.github.snooptsz/dant3' \
              --data-urlencode 'limit=20' \
              https://registry.modelcontextprotocol.io/v0.1/servers)"
            if jq -e '.servers[]? | select(.server.name == "io.github.snooptsz/dant3" and .server.version == "1.2.0")' <<<"${payload}" >/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          test "${found}" -eq 1
