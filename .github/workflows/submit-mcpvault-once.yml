name: Submit Dant3 MCP to MCPVault once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/submit-mcpvault-once.yml'

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Submit public Dant3 MCP repository
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' \
            -X POST 'https://mcpvault.io/api/mcp-submit' \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: mcpvault-mcp/0.2.0' \
            --data '{"repo_url":"https://github.com/snooptsz/dant3-mcp"}')"
          status="$(printf '%s\n' "$response" | tail -n 1)"
          body="$(printf '%s\n' "$response" | sed '$d')"
          printf 'MCPVAULT_HTTP_STATUS=%s\nMCPVAULT_BODY=%s\n' "$status" "$body" > MCPVAULT_SUBMISSION_RESULT.txt
          echo "MCPVAULT_HTTP_STATUS=$status"
          echo "MCPVAULT_BODY=$body"
          if [[ "$status" != "200" && "$status" != "201" ]]; then
            exit 1
          fi

      - name: Commit proof result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dant3-directory-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MCPVAULT_SUBMISSION_RESULT.txt
          git commit -m 'Record MCPVault submission response' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
