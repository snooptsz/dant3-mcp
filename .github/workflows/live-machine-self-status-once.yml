name: One-time live machine self-status acceptance

on:
  push:
    branches: [main]
    paths:
      - 'scripts/live-machine-self-status-smoke.mjs'
      - '.github/workflows/live-machine-self-status-once.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Register one disposable machine and verify immediate self-status
        run: node scripts/live-machine-self-status-smoke.mjs
