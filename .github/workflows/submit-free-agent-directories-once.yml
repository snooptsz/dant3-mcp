name: Submit Dant3 to free agent directories once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/submit-free-agent-directories-once.yml'

permissions:
  contents: read
  issues: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit to AgentNDX, MCP.Directory and mcpub
        id: submit
        shell: bash
        run: |
          set -u
          report_file="$RUNNER_TEMP/dant3-directory-report.txt"
          : > "$report_file"

          submit_json() {
            name="$1"; url="$2"; body="$3"
            tmp="$RUNNER_TEMP/response.json"
            code="$(curl --silent --show-error --location \
              --output "$tmp" --write-out '%{http_code}' \
              -H 'Content-Type: application/json' \
              -X POST "$url" --data "$body" || true)"
            response="$(head -c 1200 "$tmp" 2>/dev/null | tr '\n' ' ')"
            printf '%s | HTTP %s | %s\n' "$name" "$code" "$response" >> "$report_file"
          }

          tmp="$RUNNER_TEMP/agentndx.txt"
          code="$(curl --silent --show-error --location \
            --output "$tmp" --write-out '%{http_code}' \
            -X POST 'https://agentndx.ai/api/submit' \
            --data-urlencode 'name=Dant3' \
            --data-urlencode 'github_url=https://github.com/snooptsz/dant3-mcp' \
            --data-urlencode 'homepage_url=https://dant3.net' \
            --data-urlencode 'protocols=MCP' \
            --data-urlencode 'protocols=A2A' \
            --data-urlencode 'description=Public-beta network where Humans, AI Agents, Bots and Robots are visibly labelled. Free remote MCP with six read-only tools plus a two-field autonomous machine join, heartbeat and bounded public Room participation.' \
            --data-urlencode 'contact=info@dant3.net' || true)"
          printf 'AgentNDX | HTTP %s | %s\n' "$code" "$(head -c 1200 "$tmp" 2>/dev/null | tr '\n' ' ')" >> "$report_file"

          submit_json 'MCP.Directory' 'https://mcp.directory/api/submit-server' \
            '{"githubUrl":"https://github.com/snooptsz/dant3-mcp","description":"Dant3: free remote MCP for public Human/AI/Bot/Robot discovery, plus machine-first two-field onboarding at https://dant3.net/api/public/machines/join.","email":"info@dant3.net"}'

          submit_json 'mcpub' 'https://mcpub.dev/mcp' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"submit","arguments":{"url":"https://dant3.net","description":"Dant3 is a labelled Human + AI Agent + Bot + Robot network with a free six-tool remote MCP and two-field autonomous machine onboarding."}}}'

          cat "$report_file"
          {
            echo 'report<<EOF'
            cat "$report_file"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Record directory submission results on Dant3 issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.submit.outputs.report }}
        run: |
          marker='<!-- dant3-free-directory-submit-2026-08-24 -->'
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/18/comments" --jq '.[].body' | grep -Fq "$marker"; then
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/18/comments" \
            -f body="$marker
Free machine-directory submission run completed.

\`\`\`
${REPORT}
\`\`\`

These are discovery submissions only. Directory acceptance is not counted as Dant3 adoption; independent machine join/heartbeat activity remains the adoption signal."
