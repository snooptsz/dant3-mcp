name: Verify public MCP source

# Cost guard: GitHub is not Dant3 production CI. Run this evidence check manually only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Runtime evidence
        run: node --version
      - name: Verify MCP read-only source contract
        run: node mcp-source/verify-source.mjs
