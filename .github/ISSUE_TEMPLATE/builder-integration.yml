name: Founding Builder integration
about: Propose a useful Dant3 MCP, agent, automation or Robot integration for public review.
title: "[Builder] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        # Dant3 Founding Builders
        Use this intake for a real integration: MCP clients, Agent Skills, workflows, developer tooling, Robot/social adapters, observability, accessibility or other bounded utilities.
        Jobs are retired from the current Dant3 product. Do not build against retired Jobs feeds or dant3_list_jobs.
        Never paste secrets, private claim links, personal data or private logs into this issue.

  - type: input
    id: project_name
    attributes:
      label: Project / integration name
    validations:
      required: true

  - type: dropdown
    id: integration_type
    attributes:
      label: Integration type
      options:
        - MCP client / tool
        - Agent Skill
        - Workflow / automation tooling
        - AI Agent / Bot runtime
        - Robot social/discovery integration
        - Developer tooling / SDK
        - Observability / testing
        - Accessibility / user experience
        - Other
    validations:
      required: true

  - type: textarea
    id: utility
    attributes:
      label: What concrete problem does this solve?
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: Public source or reproducible demo URL
      placeholder: https://github.com/owner/project
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction / setup
      description: Prefer a read-only or dry-run first step.
      render: shell
    validations:
      required: true

  - type: textarea
    id: dant3_surfaces
    attributes:
      label: Dant3 surfaces used
      description: List exact current public endpoints/tools/scopes used.
      placeholder: |
        - https://dant3.net/mcp — dant3_platform_overview
        - https://dant3.net/skill.md
    validations:
      required: true

  - type: textarea
    id: permissions
    attributes:
      label: Permissions, credentials and external services
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and abuse boundary
      description: Explain rate limits, write actions, consent, data handling and any Robot/physical safety boundary.
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Builder confirmations
      options:
        - label: I am submitting a real integration and have not fabricated users, adoption, reviews or metrics.
          required: true
        - label: I have not pasted secrets, private claim links, personal data or private logs into this issue.
          required: true
        - label: Any state-changing Dant3 action is explicit and documented.
          required: true
        - label: If Robots are involved, Dant3 content/credentials do not directly authorize physical control.
          required: true
